<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calcContainer">
        <div class="calcboxes calcDisplay">
           <div class="insideCalcDisplay previousCalculation">3 + 6</div>
           <div class="insideCalcDisplay currentCalulation">0</div>
        </div>
        <div class="calcboxes calcButtons">
            <button class="btn">⌫</button>
            <button class="btn">AC</button>
            <button class="btn">%</button>
            <button class="btn">÷</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">x</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">-</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">+</button>
            <button class="btn btnZero">0</button>
            <button class="btn">.</button>
            <button class="btn">=</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
