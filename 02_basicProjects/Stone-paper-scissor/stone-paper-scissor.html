<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-paper-scissor</title>
    <link rel="stylesheet" href="stone-paper-scissor.css">
</head>
<body>
    <div class="gameContainer">
        <h1>Welcome to Stone Paper Scissor Game!!</h1>
        <div class="gameOptionsBox">
            <div class="gameOptions rock">
                <div id="stone" class="emoji">🪨</div>
                <p>Rock</p>
            </div>
            <div class="gameOptions paper">
                <div id="paper" class="emoji">📝</div>
                <p>Paper</p>
            </div>
            <div class="gameOptions scissor">
                <div id="paper" class="emoji">✂️</div>
                <p>Scissor</p>
            </div>
            </div>
        <div class="gameDisplay">
            <div class="output player">
                <div id="playerId" class="playerOutput">?</div>
                <p>You</p>
            </div>
            <div class="output computer">
                <div id="computerId" class="playerOutput">?</div>
                <p>Computer</p>
            </div>
        </div>
        <div class="result" id="resultId">play the game!!</div>
    </div>

    <script src="stone-paper-scissor.js"></script>
</body>
</html>
